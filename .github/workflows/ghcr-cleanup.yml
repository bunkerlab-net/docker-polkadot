name: GHCR Cleanup

# Prune sha-*, pr-*, and untagged images older than 14 days.
# latest, stable, and semver/release tags are intentionally preserved.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run: log deletions without removing anything"
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Prune old images
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Prune sha-*, pr-*, and untagged images older than 14 days
        uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
        with:
          owner: ${{ github.repository_owner }}
          packages: polkadot
          older-than: 14 days
          delete-tags: sha-*,pr-*
          delete-untagged: true
          validate: true
          dry-run: ${{ github.event.inputs.dry-run || 'false' }}

      - name: Prune master-* images
        uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
        with:
          owner: ${{ github.repository_owner }}
          packages: polkadot
          delete-tags: master-*
          keep-n-tagged: 10
          validate: true
          dry-run: ${{ github.event.inputs.dry-run || 'false' }}
